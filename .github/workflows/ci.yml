name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest
      - name: Quick reproduction (tables only)
        run: python -m hnl.cli reproduce --root . --quick --no-figures
      - name: Upload quick-run tables
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: quick-results
          path: |
            results/TABLES.md
            results/tables/
          if-no-files-found: error

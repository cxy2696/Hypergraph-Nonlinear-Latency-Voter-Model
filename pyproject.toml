[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hnl-voter-model"
version = "2.1.0"
description = "Hypergraph–Nonlinear–Latency voter model: reproducible reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Xinyi Cui" },
  { name = "Leyi Yan" },
  { name = "Ruiying Cai" },
  { name = "Chaowei Xiao" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hnl = "hnl.cli:main"

[tool.setuptools]
packages = ["hnl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
